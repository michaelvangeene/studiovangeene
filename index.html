}
    

    /* Circular mouse cursor, matching the minimal black-and-white design. */
    @media (hover: hover) and (pointer: fine) {
      html, body, body * {

    body { height: auto; min-height: 100svh; justify-content: flex-start; overflow-x: hidden; }
    main { width: 100%; padding: clamp(56px, 12svh, 140px) 0 110px; }
    .project-gallery { --slide-width: 60vw; --slide-gap: 4vw; width: 100%; }
    .project-track {
      display: flex; gap: var(--slide-gap); overflow-x: auto;
      padding-inline: calc((100vw - var(--slide-width)) / 2);
      scroll-padding-inline: calc((100vw - var(--slide-width)) / 2);
      scroll-snap-type: x mandatory; scrollbar-width: none;
      overscroll-behavior-x: contain;
    }
    .project-track::-webkit-scrollbar { display: none; }
    .project-track:focus-visible { outline: 1px solid #fff; outline-offset: -2px; }
    .project-slide { flex: 0 0 var(--slide-width); margin: 0; scroll-snap-align: center; text-align: left; }
    .project-slide img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 10; object-fit: cover; }
    .project-slide figcaption { margin-top: 12px; font: 12px/1.5 'GiphursMedium', Arial, sans-serif; color: #aaa; }
    .project-slide--bureau .project-image img { object-fit: contain; }
    .project-slide--bureau figcaption > strong,
    .project-slide--bureau figcaption > span { display: block; }
    .project-slide--bureau .project-title { color: #fff; font-weight: normal; }
    .project-slide--bureau .project-affiliation { color: #fff; margin-top: 3px; }
    .project-slide--bureau .project-photo-credit { font-size: 11px; margin-top: 3px; }
    .project-slide--bureau figcaption a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
    .project-slide--bureau figcaption a:hover { color: #fff; }
    .project-slide--bureau figcaption a:focus-visible { outline: 1px solid #fff; outline-offset: 3px; }
    .project-slide--added[data-artwork="line"] .project-image img { object-fit: contain; }
    .gallery-controls { display: flex; align-items: center; justify-content: space-between; width: var(--slide-width); margin: 14px auto 0; }
    .gallery-controls button { background: transparent; color: #fff; border: 0; font: 24px/1 Arial, sans-serif; width: 44px; height: 44px; padding: 0; }
    .gallery-controls button:focus-visible { outline: 1px solid #fff; }
    .gallery-controls span { color: #888; font-size: 11px; letter-spacing: .12em; }
    .studio-contact {
      position: fixed; inset: auto 0 0; z-index: 900;
      box-sizing: border-box; margin: 0; background: #000;
      padding: 18px 20px calc(20px + env(safe-area-inset-bottom, 0px));
      text-align: center;
    }
    .studio-contact h1 { margin: 0 0 10px; }
    .studio-contact h2 { margin: 0; }
    main { padding-bottom: calc(170px + env(safe-area-inset-bottom, 0px)); }
    .studio-contact h1 { font-size: clamp(1.15rem, 3vw, 1.8rem); }
    .studio-contact h2 { line-height: 1.8; overflow-wrap: anywhere; }
    @media (max-width: 600px) {
      .project-gallery { --slide-width: 72vw; --slide-gap: 6vw; }

      .studio-contact { margin: 0; }
      .studio-contact h2 { max-width: calc(100vw - 184px); margin-inline: auto; }
      .studio-contact h1 { font-size: clamp(1rem, 4.6vw, 1.5rem); letter-spacing: .06em; }
    }


    .project-image {
      --halftone-size: clamp(3px, .45vw, 10px);
      position: relative; overflow: hidden; isolation: isolate; background: #000;
    }
    .gallery-enhanced .project-slide:not(.is-active) .project-image {
      filter: grayscale(1) contrast(8);
    }
    .gallery-enhanced .project-slide:not(.is-active) .project-image img {
      filter: brightness(1.2) blur(calc(var(--halftone-size) * .12));
    }
    .project-image::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(circle, #fff 0%, #888 38%, #000 70%) 0 0 / var(--halftone-size) var(--halftone-size);
      mix-blend-mode: multiply; opacity: 0;
    }
    .gallery-enhanced .project-slide:not(.is-active) .project-image::after { opacity: 1; }


    .project-slide[data-artwork="line"] .project-image img {
      filter: url(#line-art);
    }
    .gallery-enhanced .project-slide:not(.is-active)[data-artwork="line"] .project-image img {
      filter: url(#line-art) blur(calc(var(--halftone-size) * .12));
    }


    .project-slide .project-title { margin: 0 0 5px; color: #fff; font: 14px/1.5 'GiphursMedium', Arial, sans-serif; letter-spacing: .02em; }
    .project-description { margin: 10px 0 0; max-width: 68ch; color: #bbb; font: 12px/1.65 Arial, sans-serif; }
    .project-tags { display: flex; flex-wrap: wrap; gap: 5px 7px; margin-top: 10px; }
    .project-tag { border: 1px solid #333; border-radius: 3px; padding: 3px 7px; font: 10px/1.4 Arial, sans-serif; color: #999; }
    .project-track { align-items: flex-start; }

  <script>
    (() => {
      const track = document.querySelector('.project-track');
      const originals = Array.from(track.querySelectorAll('.project-slide'));
      const count = originals.length;
      const counter = document.getElementById('project-counter');
      const gallery = track.closest('.project-gallery');
      // Three identical runs keep real neighbours visible across both seams.
      // Return to the middle run only after scrolling has settled.
      function cloneRun() {
        const fragment = document.createDocumentFragment();
        originals.forEach(slide => {
          const clone = slide.cloneNode(true);
          clone.removeAttribute('id');
          clone.dataset.clone = 'true';
          clone.setAttribute('aria-hidden', 'true');
          clone.querySelectorAll('[id]').forEach(node => node.removeAttribute('id'));
          clone.querySelectorAll('a, button, [tabindex]').forEach(node => node.tabIndex = -1);
          clone.querySelectorAll('img').forEach(img => {
            img.loading = 'lazy';
            img.removeAttribute('fetchpriority');
          });
          fragment.append(clone);
        });
        return fragment;
      }
      track.prepend(cloneRun());
      track.append(cloneRun());
      const slides = Array.from(track.querySelectorAll('.project-slide'));
      gallery.classList.add('gallery-enhanced');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let active = count + 1;
      let frame = 0;
      let settleTimer = 0;
      let pointerDown = false;
      let wheelTarget = null;
      let wheelAmount = 0;
      let wheelDirection = 0;
      let wheelAt = -Infinity;
      let wheelReset = 0;
      const logicalIndex = index => ((index % count) + count) % count;
      const position = index => slides[index].offsetLeft - track.offsetLeft
        - (track.clientWidth - slides[index].clientWidth) / 2;
      function show(index, animate = true) {
        active = Math.max(0, Math.min(slides.length - 1, index));
        track.scrollTo({ left: position(active),
          behavior: animate && !reducedMotion.matches ? 'smooth' : 'instant' });
      }
      function update() {
        const center = track.scrollLeft + track.clientWidth / 2;
        active = slides.reduce((best, slide, index) => {
          const distance = Math.abs(slide.offsetLeft - track.offsetLeft + slide.clientWidth / 2 - center);
          const previous = slides[best];
          const bestDistance = Math.abs(previous.offsetLeft - track.offsetLeft + previous.clientWidth / 2 - center);
          return distance < bestDistance ? index : best;
        }, 0);
        slides.forEach((slide, index) => slide.classList.toggle('is-active', index === active));
        counter.textContent = String(logicalIndex(active) + 1).padStart(2, '0') + ' / ' + String(count).padStart(2, '0');
        frame = 0;
      }
      function normalize() {
        if (pointerDown) return;
        update();
        if (active >= count && active < count * 2) return;
        const middle = count + logicalIndex(active);
        const delta = position(middle) - position(active);
        // Preserve any sub-slide offset; the same pixels remain on screen.
        const left = track.scrollLeft + delta;
        track.style.scrollSnapType = 'none';
        track.scrollTo({ left, behavior: 'instant' });
        if (wheelTarget !== null) wheelTarget += middle - active;
        active = middle;
        update();
        requestAnimationFrame(() => { track.style.scrollSnapType = ''; });
      }
      track.addEventListener('scroll', () => {
        if (!frame) frame = requestAnimationFrame(update);
        clearTimeout(settleTimer);
        settleTimer = setTimeout(normalize, 160);
      }, { passive: true });
      track.addEventListener('scrollend', normalize);
      function resetWheel() {
        clearTimeout(wheelReset);
        wheelReset = 0;
        wheelTarget = null;
        wheelAmount = 0;
        wheelDirection = 0;
        wheelAt = -Infinity;
      }
      gallery.addEventListener('wheel', event => {
        // Keep browser zoom and native horizontal trackpad scrolling available.
        if (event.ctrlKey || event.metaKey || event.shiftKey || !event.deltaY
            || Math.abs(event.deltaX) > Math.abs(event.deltaY)) {
          resetWheel();
          return;
        }
        const direction = Math.sign(event.deltaY);
        if (!event.cancelable) return;
        event.preventDefault();
        clearTimeout(wheelReset);
        wheelReset = setTimeout(resetWheel, 220);
        if (direction !== wheelDirection) {
          wheelAmount = 0;
          wheelAt = -Infinity;
        }
        wheelDirection = direction;
        const now = performance.now();
        const unit = event.deltaMode === 1 ? 16
          : event.deltaMode === 2 ? track.clientWidth : 1;
        wheelAmount += event.deltaY * unit;
        // Every input contributes. A larger/faster gesture can cross many slides.
        const steps = Math.trunc(wheelAmount / 100);
        if (!steps) return;
        wheelAmount -= steps * 100;
        const fast = Math.abs(steps) > 1 || now - wheelAt < 110;
        wheelAt = now;
        wheelTarget = (wheelTarget === null ? active : wheelTarget) + steps;
        // Rebase very long gestures before they reach the end of the clone runs.
        if (wheelTarget < 1 || wheelTarget >= slides.length - 1) {
          wheelTarget = count + logicalIndex(wheelTarget);
          show(wheelTarget, false);
        } else {
          show(wheelTarget, !fast);
        }
      }, { passive: false });
      track.addEventListener('pointerdown', () => {
        pointerDown = true;
        resetWheel();
      }, { passive: true });
      const releasePointer = () => {
        pointerDown = false;
        clearTimeout(settleTimer);
        settleTimer = setTimeout(normalize, 160);
      };
      window.addEventListener('pointerup', releasePointer, { passive: true });
      window.addEventListener('pointercancel', releasePointer, { passive: true });
      document.getElementById('previous-project').addEventListener('click', () => {
        resetWheel();
        show(active - 1);
      });
      document.getElementById('next-project').addEventListener('click', () => {
        resetWheel();
        show(active + 1);
      });
      track.addEventListener('keydown', event => {
        if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
          event.preventDefault();
          resetWheel();
          show(active + (event.key === 'ArrowRight' ? 1 : -1));
        }
      });
      window.addEventListener('resize', () => {
        resetWheel();
        show(count + logicalIndex(active), false);
      });
      show(active, false);
      update();
    })();
  </script>

</body>
</html>
