name: Clear superseded Pages retry
on:
  push:
    branches: [main]
    paths: [.github/workflows/recover-pages.yml]
permissions:
  actions: write
jobs:
  cancel-superseded-retry:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel the outdated retry if still pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          retry_state=$(gh api repos/michaelvangeene/studiovangeene/actions/runs/38596969665 --jq .status)
          if [ "$retry_state" != "completed" ]; then
            gh api --method POST repos/michaelvangeene/studiovangeene/actions/runs/38596969665/cancel
          fi
