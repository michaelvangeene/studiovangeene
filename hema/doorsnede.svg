  <title id="titel">Doorsnedeprincipe tussen de Oudegracht en de Steenweg</title>
  <desc id="uitleg">Onderzoeksdiagram van een historisch grachtdeel, een nieuwbouwdeel met drie bouwlagen en een kelder, en de interne verbinding op ongelijke niveaus.</desc>
